name: Copilot CLI Submission Tracking

on:
  issues:
    types: [opened]

jobs:
  submission-tracking:
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:

      # Check whether this is a Copilot CLI completion submission
      - name: Check submission
        id: check-submission
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            const labels = issue.labels.map(label =>
              label.name.toLowerCase()
            );

            if (labels.includes('completion')) {
              core.setOutput('is_submission', 'true');
            } else {
              core.setOutput('is_submission', 'false');
            }

      # Add Pending Review label
      - name: Add Pending Review label
        if: steps.check-submission.outputs.is_submission == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['review-required']
            });

      # Post Pending Review message
      - name: Post Pending Review message
        if: steps.check-submission.outputs.is_submission == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const student = context.payload.issue.user.login;

            const message = `## 📋 Submission Received!

            Hi @${student}! 👋

            Thank you for submitting your **GitHub Copilot CLI for Beginners Assessment**.
            Your submission has been successfully received.

            ### ⌛ Assessment Status

            **Status:** 🟡 Pending Review
            **Reviewer:** @pathumzcode
            **Expected Review Time**: 2-5 days

            ### 🔍 What happens next?

            We will manually review your submission.
            If your submission meets all assessment requirements, issue is successfully approved and closed, your **GitHub Copilot CLI Assessment Completion Badge** will be assigned automatically. 🏆

            Follow me for more updates - https://github.com/pathumzcode
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });